<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Level3_edi</title>
    <link rel="stylesheet" href="./bootstrap-4.1.3/css/bootstrap.css">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/jquery-ui.css">
    <link rel='stylesheet' href="./calendar/fullcalendar.css" />
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css" integrity="sha384-50oBUHEmvpQ+1lW4y57PTFmhCaXp0ML5d60M1M7uH2+nqUivzIebhndOJK28anvf" crossorigin="anonymous">
    <!-- Data Table Css  -->
    <link rel='stylesheet' href="./css/data_table_css.css" />
    <!-- Bootstrap Datepicker -->
    <link rel="stylesheet" type="text/css" href="./css/bootstrap-datepicker.css">

</head>

<body>
    <div class="loader d-block">
        <!-- <center> -->
        <img class="" style="position: absolute; z-index: 999; top: 10%; left: 30%;" src="./images/loader/ajax-loader.gif">
        <!-- </center> -->
    </div>
    <div class="container d-none">
        <hr>
        <div class="row">
            <div class="col-md-3">
            </div>
            <div class="col-md-4 text-right">
                <div class=" form-check form-check-inline">
                    <input id="interval_flag" name="interval_flag" type="checkbox" class="form-check-input" checked>
                    <label class="form-check-label" for="interval_flag">自動実行:</label>
                </div>
            </div>
            <div class="col-md-2">
                <p id="interval_status" class="bg-info text-center text-white">動作中</p>
            </div>
            <div class="col-md-3" style="text-align: right;" id="user_name_show">User Name</div>
            <input type="hidden" id="user_id" value="">
        </div>
        <hr>
        <div class="row">
            <input type="hidden" name="" id="service_id_for_job_exec_trigger" value="0">
            <div class="col-md-12" style="padding:0px;">
                <!-- -- Tab Stratt -- -->
                <div id="tabs">
                    <ul>
                        <li><a href="#tabs-2" id="area_refresh">設定</a></li>
                    </ul>
                    <div id="tabs-2" style="padding: 0px;">
                        <div id="tabs2">
                            <ul>
                                <li><a href="#tabs2-2" id="sub_area_refresh">取引先設定</a></li>
                                <li><a href="#tabs3-2">業務カレンダー</a></li>
                            </ul>

                            <div id="tabs2-2" style="padding: 0px;">
                                <div class="row box1">
                                    <div class="col-md-12">
                                        <br>
                                        <div class="row">
                                            <div class="offset-md-1 col-md-10 ">
                                                <table class="table table-bordered">
                                                    <tr>
                                                        <td>取引先名</td>
                                                        <td id="company_name_view"></td>
                                                        <td>取引先ID</td>
                                                        <td id="company_id_view"></td>
                                                        <input type="hidden" id="company_id_view_hidden" value="0">
                                                    </tr>
                                                </table>

                                            </div>
                                        </div>
                                        <!-- <br> -->
                                        <!-- Hidden Part Start   -->
                                        <div id="alert_message"></div>
                                        <div class="row ">

                                            <div class="col-md-4" id="customer_info">
                                                <div class="row">
                                                    <div class="col-md-12">

                                                        <!-- <button class="btn btn-primary " id="add_customer"><i class="fas fa-plus-circle"></i> 取引先追加</button> -->
                                                    </div>
                                                </div>
                                                <table class="table table-bordered" id="customer_info_table">
                                                    <thead>
                                                        <th>No</th>
                                                        <th>取引先名</th>
                                                    </thead>
                                                    <tbody>
                                                    </tbody>
                                                </table>
                                            </div>
                                            <div class="col-md-8">
                                                <div class="row">
                                                    <div class="col-md-12  text-right">
                                                        <button class="btn btn-primary " id="add_service"><i
                                                                class="fas fa-plus-circle"></i> サービス追加</button>
                                                    </div>
                                                </div>
                                                <table class="table table-bordered" id="service_info_table">
                                                    <thead>
                                                        <th>No</th>
                                                        <th>サービス名</th>
                                                        <th>手動実行</th>
                                                        <th>設定</th>
                                                    </thead>
                                                    <tbody>
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div id="tabs3-2">
                                <!-- Calander -->
                                <div class="row box1">
                                    <div class="col-md-12">
                                        <div class="row">
                                            <div class="col-md-7 border-dark show-label">
                                                <h4 class="border-dark">業務カレンダー設定</h4>
                                            </div>
                                            <div class="col-md-5 d-flex">
                                            </div>
                                        </div>
                                        <br>
                                        <!-- Hidden Part Start   -->
                                        <div class="row ">
                                            <div class="col-md-12">
                                                <div id="calendar"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <!-- Calander -->
                            </div>
                        </div>
                    </div>
                </div>
                <!-- -- TabEnd -- -->
            </div>
        </div>
    </div>

    <!-- SCHEDULE Modal  -->
    <div class="modal fade " id="schedule_modal" role="dialog">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">サービス設定</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body" style="padding:5px;">
                    <!-- -- Account Setting Start -- -->
                    <div id="rpa_schedule_message"></div>
                    <div id="tabs-popup-cover">
                        <ul>
                            <li><a href="#tabs-popup-cover-1">トリガー</a></li>
                        </ul>

                        <div id="tabs-popup-cover-1" style="padding: 0px;">
                            <div class="" id="tabs-popup">
                                <ul>
                                    <li>
                                        <a href="#tabs-popup-3">
                                            <div name="trigger_setting"></div> フォルダ監視
                                        </a>
                                    </li>
                                    <li>
                                        <a href="#tabs-popup-4">
                                            <div name="trigger_setting"></div> API監視
                                        </a>
                                    </li>
                                    <!-- File Path  -->
                                </ul>

                                <div id="tabs-popup-1" style="padding: 0px;">
                                    <br />
                                    <div class="row">
                                        <input type="hidden" id="service_id_popup" value="">
                                    </div>

                                </div>
                                
                                <div id="tabs-popup-3" style="padding: 0px;">
                                    <br />
                                    <div class="row">
                                        <div class="col-md-1"></div>
                                        <div class="col-md-10">
                                            <div class="form-group">
                                                <div class="row">
                                                    <label class="col-md-8 control-label" for="path_execution_flag">フォルダ監視実行</label>
                                                   
                                                    <input type="hidden" value="" id="file_job_id">
                                                    <div class="col-md-4">
                                                        <input id="path_execution_flag" name="path_execution_flag" type="checkbox" class="" style="text-align: left !important;">
                                                    </div>
                                                </div>
                                            </div>

                                            <div class="form-group">
                                                <label class="col-md-12 control-label path_level" for="source_dir_path">監視フォルダパス</label>
                                                
                                                <div class="upload-btn-wrapper">
                                                    <input type="text" class="file_path_level control-label  text-left" id="source_dir_path_input">
                                                    <button class="btn  browse_btn file_path_level_button" onclick="$('#source_dir_path').click();">参照</button>
                                                    <input type="file" class="file_input" id="source_dir_path" multiple directory webkitdirectory mozdirectory />
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-md-12 control-label path_level" for="moved_dir_path">ファイル移動先フォルダパス</label>
                                                
                                                <div class="upload-btn-wrapper">
                                                    <input type="text" class="file_path_level control-label  text-left" id="moved_dir_path_input">
                                                    <button class="btn  browse_btn" onclick="$('#moved_dir_path').click();">参照</button>
                                                    <input type="file" class="file_input" id="moved_dir_path" multiple directory webkitdirectory mozdirectory />
                                                </div>
                                            </div>

                                        </div>
                                        <div class="col-md-1"></div>
                                    </div>

                                    <div class="row">
                                        <div class="col-sm-12">
                                            <div class="row">
                                                <div class="col-sm-1"></div>
                                                <div class="col-sm-4">
                                                    <button class="btn btn-primary float-left" style="margin-right: 10px;" id="file_path_save">保存</button>
                                                </div>
                                                <div class="col-sm-6"></div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div id="tabs-popup-4" style="padding: 0px;">
                                    <br />
                                    <div class="row">
                                        <div class="col-md-1"></div>
                                        <div class="col-md-10">
                                            <div class="form-group">
                                                <div class="row">
                                                    <label class="col-md-8 control-label" for="api_execution_flag">API実行</label>
                                                    <div class="col-md-4">
                                                        <input id="api_execution_flag" name="api_execution_flag" type="checkbox" class="" style="text-align: left !important;">
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-md-12 control-label path_level" for="api_url">API</label>
                                                <!--File Source Path-->
                                                <div class="upload-btn-wrapper">
                                                    <input type="text" style="width: 100% !important;" class="file_path_level control-label  text-left" id="api_url">
                                                </div>
                                            </div>
                                            <div class="form-group">
                                                <label class="col-md-12 control-label path_level" for="api_dir_path">APIフォルダパス</label>
                                                <!-- File Move Path -->
                                                <div class="upload-btn-wrapper">
                                                    <input type="text" class="file_path_level control-label  text-left" id="api_dir_path_input">
                                                    <button class="btn  browse_btn" onclick="$('#api_dir_path').click();">参照</button>
                                                    <input type="file" class="file_input" id="api_dir_path" multiple directory webkitdirectory mozdirectory />
                                                </div>
                                            </div>

                                        </div>
                                        <div class="col-md-1"></div>
                                    </div>

                                    <div class="row">
                                        <div class="col-sm-1"></div>
                                        <div class="col-sm-4">
                                            <button class="btn btn-primary float-left" id="api_url_save">保存</button>
                                        </div>
                                        <div class="col-sm-7"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" data-dismiss="modal">閉じる</button>
                </div>
                </form>
            </div>
        </div>
    </div>
    <!-- Modal End    -->

    <!-- Schedule modal  -->

    <!-- Add customer modal  -->
    <div class="modal fade" id="add_customer_modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">新規追加</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body" style="padding:5px;">
                    <div id="add_customer_message"></div>
                    <input type="hidden" value="" id="customer_update_id">
                    <div class="form-group row">
                        <label class="col-sm-5 col-form-label" for="customer_name">取引先名</label>
                        <div class="col-sm-7">
                            <input type="text" id="customer_name" class="form-control" placeholder="取引先名">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-5 col-form-label" for="partner_code">取引先コード</label>
                        <div class="col-sm-7">
                            <input type="number" id="partner_code" class="form-control" placeholder="取引先コード">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="new_customer_create">保存</button>
                    <button type="button" class="btn btn-danger" id="customer_delete">削除</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">キャンセル</button>
                </div>
                </form>
            </div>
        </div>
    </div>
    <!--Add customer Modal End    -->
    <!-- Add service modal  -->
    <div class="modal fade" id="add_service_modal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="exampleModalLabel">サービス</h5>
                    <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>

                <div class="modal-body" style="padding:5px;">
                    <div id="add_service_message"></div>
                    <input type="hidden" value="" id="service_update_id">
                    <input type="hidden" value="" id="clicked_row_number">
                    <div class="form-group row">
                        <div class="col-sm-4 text-right">
                            <label class="col-form-label" for="service_name">サービス名</label>
                        </div>
                        <div class="col-sm-8">
                            <input type="text" id="service_name" class="form-control" placeholder="サービス名">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" id="new_service_create">保存</button>
                    <button type="button" class="btn btn-danger d-none" id="service_delete">削除</button>
                    <button type="button" class="btn btn-secondary" data-dismiss="modal">キャンセル</button>
                </div>
                </form>
            </div>
        </div>
    </div>
    <!--Add service Modal End    -->
    <!-- Calendar Modal -->
    <div class="modal fade tab-modal-box" id="myModal">
        <div class="modal-dialog modal-md modal-tab">
            <div class="modal-content">
                <!-- Modal Header -->
                <div class="modal-header">
                    <h4 class="modal-title">休日設定</h4>
                    <button type="button" class="close" data-dismiss="modal">&times;</button>
                </div>
                <!-- Modal body -->
                <div class="modal-body" style="padding:5px;">
                    <div id="calander_message"></div>
                    <div class="form-group row">
                        <label for="title" class="col-sm-3 col-form-label">設定名</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" name="title" id="title" placeholder="名前">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="startDate" class="col-sm-3 col-form-label">開始日</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="startDate" value="" name="startDate">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label for="endDate" class="col-sm-3 col-form-label">終了日</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="endDate" value="" name="endDate">
                        </div>
                    </div>
                    <div class="form-group row">
                        <label class="col-sm-3 col-form-label"></label>
                        <div class="col-sm-8">
                            <button class="btn btn-primary btn-lg float-left" style="margin-right: 10px;" id="sbtn">設定</button>
                            <button class="btn btn-danger btn-lg float-left" id="delete" id="sbtn">削除する</button>

                        </div>
                    </div>
                </div>
                <!-- Modal footer -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="myReset" data-dismiss="modal">閉じる
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- Calendar Modal End -->

    <!-- Scripts -->
    <script>
        if (typeof module === 'object') {
            window.module = module;
            module = undefined;
        }
    </script>
    <script src="./js/jquery-3.4.1.min.js"></script>
    <script>
        if (window.module) module = window.module;
    </script>

    <script type="text/javascript" src="./bootstrap-4.1.3/js/bootstrap.js"></script>
    <script type="text/javascript" src="./js/jquery-ui.js"></script>
    <script type="text/javascript" src="./js/index.js"></script>
    <script type="text/javascript" src="./js/all_function.js"></script>
    <script type="text/javascript" src="./js/jcs_mail.js"></script>
    <!-- Calendar -->
    <script type="text/javascript" src="./calendar/moment.min.js"></script>
    <script type="text/javascript" src="./calendar/fullcalendar.js"></script>
    <script type="text/javascript" src="./calendar/locale-all.js"></script>
    <!-- Calendar -->
    <!-- Data Table JS  -->
    <script type="text/javascript" src="./js/data_table_js.js"></script>
</body>

</html>

</html>
